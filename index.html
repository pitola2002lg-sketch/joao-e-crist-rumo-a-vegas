    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        
        #game-container {
            position: relative;
            width: min(1000px, 100vw);
            aspect-ratio: 20 / 13;
            box-shadow: 0 8px 28px rgba(0,0,0,.65);
        }
        
        #game {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        
        .version-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #00ffff;
            padding: 5px 10px;
            border-radius: 5px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 14px;
            z-index: 1000;
        }
        
        .new-badge {
            background: #ff0000;
            color: #fff;
            padding: 2px 5px;
            border-radius: 3px;
            font-size: 10px;
            margin-left: 5px;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
            #game-container:fullscreen { width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; background:#000; }
        #game-container:fullscreen { width:100vw; height:100vh; aspect-ratio:auto; }
        #game-container:fullscreen #game { width:min(100vw, calc(100vh * 20 / 13)); height:min(100vh, calc(100vw * 13 / 20)); }
    </style>
</head>
